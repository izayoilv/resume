repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
  - repo: local
    hooks:
      - id: ats-check
        name: ATS parse check (resume PDF)
        entry: ./ats-check.sh
        language: system
        pass_filenames: false
        files: ^(resume\.tex|Vincent_Yongky_Pratama_Resume\.pdf)$
